name: Bug 回報
description: 回報使用 Antigravity Codex Effort Slider 時遇到的異常或介面問題
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 問題描述
      description: 請簡述遇到的異常狀況或非預期行為。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 重現步驟
      description: 請條列可重現此問題的操作步驟。
      placeholder: |
        1. 開啟 Antigravity 模型選擇器
        2. 滑動 Reasoning Effort 或展開右側 Select Model
        3. 觀察到的異常現象...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 執行環境
      description: 請填寫作業系統、Antigravity Desktop 版本與 Node.js 版本。
      placeholder: "Windows 11 / Antigravity x.x.x / Node v22.x"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 診斷資訊 / Aux Pane 狀態（選填）
      description: 可右鍵滑條選擇「複製診斷」或貼上 Aux Pane `/api/status` 輸出（請移除任何個人路徑或敏感資訊）。
